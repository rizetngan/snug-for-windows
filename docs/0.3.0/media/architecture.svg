<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Snug for Windows 0.3.0 architecture</title>
<desc id="desc">Android controller connects through UU Remote or CrossDesk to a Windows host running Snug. Snug creates a portrait virtual display and manages windows, native zoom and touch gestures.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F9F8"/><stop offset="1" stop-color="#EDF2F1"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6A858A"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1D343B" flood-opacity=".08"/></filter>
</defs>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<text x="56" y="65" fill="#203640" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Snug for Windows · 0.3.0</text>
<text x="56" y="98" fill="#60777C" font-family="Segoe UI,Arial,sans-serif" font-size="15">One portrait workspace. Two remote-control providers. Native Windows interaction.</text>
<g filter="url(#shadow)">
  <rect x="56" y="145" width="260" height="270" rx="20" fill="#FFFFFF"/>
  <rect x="374" y="145" width="260" height="270" rx="20" fill="#FFFFFF"/>
  <rect x="692" y="145" width="452" height="270" rx="20" fill="#FFFFFF"/>
</g>
<g font-family="Segoe UI,Arial,sans-serif">
  <circle cx="92" cy="184" r="17" fill="#E7EFED"/><path d="M86 176h12v17H86z M89 172h6" stroke="#42656A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="120" y="190" font-size="19" font-weight="700" fill="#203640">Android phone / tablet</text>
  <text x="82" y="238" font-size="15" fill="#60777C">Controller</text>
  <rect x="82" y="260" width="208" height="52" rx="12" fill="#EDF4F2"/>
  <text x="102" y="292" font-size="17" font-weight="600" fill="#315C5C">UU Remote</text>
  <rect x="82" y="326" width="208" height="52" rx="12" fill="#F8F0E7"/>
  <text x="102" y="358" font-size="17" font-weight="600" fill="#875D34">CrossDesk client</text>
  <text x="82" y="397" font-size="12" fill="#7A8D90">Touch, pointer and keyboard input</text>
  <circle cx="410" cy="184" r="17" fill="#E7EFED"/><path d="M402 184h16 M410 176v16" stroke="#42656A" stroke-width="2" stroke-linecap="round"/>
  <text x="438" y="190" font-size="19" font-weight="700" fill="#203640">Remote transport</text>
  <rect x="400" y="244" width="208" height="62" rx="13" fill="#EDF4F2"/>
  <text x="424" y="270" font-size="17" font-weight="700" fill="#315C5C">UU session</text>
  <text x="424" y="290" font-size="12" fill="#60777C">Existing UU workflow</text>
  <rect x="400" y="324" width="208" height="62" rx="13" fill="#F8F0E7"/>
  <text x="424" y="350" font-size="17" font-weight="700" fill="#875D34">CrossDesk session</text>
  <text x="424" y="370" font-size="12" fill="#80694F">Android controller → Windows host</text>
  <circle cx="728" cy="184" r="17" fill="#E7EFED"/><path d="M720 179h16v11h-16z M724 194h8" stroke="#42656A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="756" y="190" font-size="19" font-weight="700" fill="#203640">Windows PC</text>
  <rect x="724" y="230" width="388" height="146" rx="16" fill="#203640"/>
  <text x="752" y="266" font-size="21" font-weight="700" fill="#FFFFFF">Snug for Windows</text>
  <text x="752" y="292" font-size="13" fill="#C5D4D4">Native display and input layer</text>
  <rect x="752" y="316" width="156" height="40" rx="10" fill="#315C5C"/>
  <text x="770" y="341" font-size="13" font-weight="600" fill="#FFFFFF">Portrait virtual screen</text>
  <rect x="920" y="316" width="164" height="40" rx="10" fill="#A86E43"/>
  <text x="937" y="341" font-size="13" font-weight="600" fill="#FFFFFF">Window + touch routing</text>
</g>
<path d="M316 280 H366" stroke="#6A858A" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M634 280 H684" stroke="#6A858A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="56" y="474" fill="#203640" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">What Snug adds</text>
<g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
  <rect x="56" y="500" width="252" height="100" rx="16" fill="#FFFFFF"/>
  <rect x="326" y="500" width="252" height="100" rx="16" fill="#FFFFFF"/>
  <rect x="596" y="500" width="252" height="100" rx="16" fill="#FFFFFF"/>
  <rect x="866" y="500" width="278" height="100" rx="16" fill="#FFFFFF"/>
  <text x="80" y="540" font-size="16" font-weight="700" fill="#315C5C">Phone-sized display</text><text x="80" y="566" font-size="13" fill="#60777C">Portrait modes and safe areas</text>
  <text x="350" y="540" font-size="16" font-weight="700" fill="#315C5C">App Library</text><text x="350" y="566" font-size="13" fill="#60777C">Fit, switch and restore windows</text>
  <text x="620" y="540" font-size="16" font-weight="700" fill="#315C5C">Native zoom</text><text x="620" y="566" font-size="13" fill="#60777C">No browser extension or page access</text>
  <text x="890" y="540" font-size="16" font-weight="700" fill="#875D34">Touch translation</text><text x="890" y="566" font-size="13" fill="#60777C">Tap, slide, long press and scroll</text>
</g>
<text x="56" y="628" fill="#718589" font-family="Segoe UI,Arial,sans-serif" font-size="11">Switch providers only after the current remote session ends and the phone display is released.</text>
</svg>